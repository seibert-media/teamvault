{% load i18n %}

{% with member_count=group.user_set.count %}
    <span class="text-uppercase text-muted small fw-semibold">
        {% trans "About this group" %}
    </span>
    <div class="d-flex align-items-center gap-2 mt-2">
        <span class="avatar avatar-lg d-flex align-items-center justify-content-center text-bg-info fw-semibold">
            {{ member_count }}
        </span>
        <div>
            <div class="fw-semibold">{{ group.name }}</div>
            <small class="text-muted">{{ member_count }} {% trans "Members" %}</small>
        </div>
    </div>
    {# TODO: Avatar-Stapel der ersten Mitglieder, wenn gewünscht #}
    <ul class="list-unstyled small text-muted d-flex flex-column gap-1 mt-3 mb-0">
        <li><i class="fa fa-arrow-up-right-from-square fa-fw me-1"></i>
            <a href="{% url 'accounts.group-detail' groupname=group.name %}"
               target="_blank"
               class="text-decoration-none fw-semibold">{% trans "View all members" %}</a>
        </li>
    </ul>
{% endwith %}
