{% load i18n %}

<span class="text-uppercase text-muted small fw-semibold">
    {% trans "About this user" %}
</span>
<div class="d-flex align-items-center gap-2 mt-4">
    {% include "accounts/_avatar.html" with user=user classes="avatar-lg" %}
    <div>
        <div class="fw-semibold">{{ user.get_full_name|default:user.username }}</div>
        <small class="text-muted">@{{ user.username }}</small>
    </div>
</div>
<ul class="list-unstyled small text-muted d-flex flex-column gap-1 mt-3 mb-0">
    <li><i class="fa fa-envelope fa-fw me-1"></i>{{ user.email }}</li>
    {% if request.user.is_superuser %}
        <li><i class="fa fa-arrow-up-right-from-square fa-fw me-1"></i>
            <a href="{% url 'accounts.user-detail' username=user.username %}"
               target="_blank"
               class="text-decoration-none fw-semibold">{% trans "View profile" %}</a>
        </li>
    {% endif %}
</ul>
