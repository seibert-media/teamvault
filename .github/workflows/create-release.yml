name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without creating a GitHub release or publishing to PyPI"
        required: false
        type: boolean
        default: true
      version:
        description: 'New version (e.g., 0.2.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@v3.2.0 # immutable
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Install system dependencies for python-ldap
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libldap2-dev libsasl2-dev

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # No dependency caches in this workflow: the frontend bundle and wheel
      # published from here should never be built from restorable cache state.
      - name: Frontend Install Dependencies and Build
        run: |
          bun install --frozen-lockfile
          bun run build
        working-directory: ${{ github.workspace }}

      - name: Zip Bundle
        run: |
          zip -r "$BUNDLE_ZIP" bundled
        env:
          BUNDLE_ZIP: ${{ github.workspace }}/teamvault/static/bundled.zip
        working-directory: ${{ github.workspace }}/teamvault/static

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0 # immutable
        with:
          enable-cache: false

      - name: Update version
        run: |
          # If the input is a bump type, uv handles it automatically. If not, it sets the specific version
          uv version ${{ github.event.inputs.version }}

      - name: Commit and Tag Release
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ secrets.RELEASE_BOT_APP_ID }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git add pyproject.toml uv.lock
          git commit -m "Release v${{ github.event.inputs.version }}"
          git tag -a "v${{ github.event.inputs.version }}" -m "Version ${{ github.event.inputs.version }}"
          git push origin main --tags

      - name: Build Distributions
        run: uv build

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          files: |
            dist/*
            ${{ github.workspace }}/teamvault/static/bundled.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect wheel contents (smoke test)
        run: |
          unzip -l dist/*.whl | grep -E "teamvault/static/bundled|webpack-stats.json"

      # For manual runs: test publish logic, but don't upload anything
      - name: Publish to PyPI (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          uv publish --dry-run

      # For real releases: actually publish
      - name: Publish package distribution to PyPI with uv
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          uv publish --trusted-publishing always
