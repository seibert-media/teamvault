name: Run Django Tests on PR

on:
  pull_request:
  push:
    branches:
      - 'main'
  workflow_dispatch:


jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Run Ruff format check
        run: just check-format

      - name: Run Ruff
        run: just check-lint

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # based on django version in dependencies - minus 3.10 & 3.11 because of typing support
        python-version: ["3.12", "3.13", "3.14"]

    env:
      TEAMVAULT_CONFIG_FILE: ${{ github.workspace }}/teamvault.cfg
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/teamvault
      PGPORT: 5432

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: teamvault
          POSTGRES_USER: teamvault
          POSTGRES_PASSWORD: teamvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
          build-essential \
          libffi-dev \
          libldap2-dev \
          libpq-dev \
          libsasl2-dev \
          postgresql-contrib

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set Up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .venv
          key: uv-venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('**/uv.lock', '**/pyproject.toml') }}
          restore-keys: |
            uv-venv-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: uv sync

      - name: Activate venv for later steps
        shell: bash
        run: echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Build frontend bundle
        working-directory: ${{ github.workspace }}
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install Playwright browsers
        working-directory: ${{ github.workspace }}
        run: uv run playwright install --with-deps chromium --no-shell

      - name: Set Up TeamVault Config File
        working-directory: ${{ github.workspace }}
        run: teamvault setup

      - name: Run Tests
        working-directory: ${{ github.workspace }}
        run: just test
